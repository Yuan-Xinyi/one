# Morphology-general null-space policy: one TokenAgent trained over the
# FR3 and the xArm7 plus 8 random length/speed variants of each (16 arms,
# 8192 envs). The paper's PPO recipe and environment settings; each arm
# keeps its own task-space speed and tool (FR3 0.2034 m pen behind the
# 0.107 m flange, xArm7 0.10 m pen on the flange plate).
arms:
  - {base: fr3,   variants: 0, n_envs: 2048}
  - {base: fr3,   variants: 8, seed: 1, n_envs_each: 256, len_scale: [0.75, 1.25], qd_scale: [0.7, 1.3]}
  - {base: xarm7, variants: 0, n_envs: 2048}
  - {base: xarm7, variants: 8, seed: 2, n_envs_each: 256, len_scale: [0.75, 1.25], qd_scale: [0.7, 1.3]}
env:
  dir_frac_action: 2
  a_prev_executed: true
  observe_margins: true
  true_reset_obs: true
  rho_from_norm: true
  observe_proj_scales: true
  dt: 0.05
  a_max: 0.5
  lambda_0: 0.05
  sigma_thr: 0.05
  cone_deg: 30.0
  max_steps: 500
  r_collision: 0.0
  r_cone: 0.0
  r_jl: 0.0
  w_progress: 1.0
  manip_damping: 0.001
ppo:
  total_timesteps: 240000000
  learning_rate: 0.0006
  n_steps: 4
  anneal_lr: true
  gamma: 0.99
  gae_lambda: 0.95
  n_minibatches: 32
  update_epochs: 15
  norm_adv: true
  clip_coef: 0.2
  clip_vloss: true
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.02
  hidden_dim: 512
  init_log_std: -0.5
  normalize_returns: true
  squashed_entropy: true
agent:
  d_model: 192
  nhead: 4
  n_layers: 3
line_distribution:
  n_pool: 100000
  n_pool_variant: 20000
  n_target_noise_deg: 5.0
  train_seed: 0
  feasibility_filter: true
  feasibility_threshold_m: 0.1
eval:
  n_holdout: 200
  holdout_seed: 42
train:
  eval_every: 500000
  ckpt_every_n_updates: 10
