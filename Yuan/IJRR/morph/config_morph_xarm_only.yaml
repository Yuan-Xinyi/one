# Leave-one-arm-out: the same recipe trained on the xArm7 and 6 random
# variants of it only (never an FR3-shaped chain); the FR3 is then a
# held-out morphology at test time.
arms:
  - {base: xarm7, variants: 0, n_envs: 3072}
  - {base: xarm7, variants: 6, seed: 2, n_envs_each: 853, len_scale: [0.75, 1.25], qd_scale: [0.7, 1.3]}
env:
  dir_frac_action: 2
  a_prev_executed: true
  observe_margins: true
  true_reset_obs: true
  rho_from_norm: true
  observe_proj_scales: true
  dt: 0.05
  a_max: 0.5
  lambda_0: 0.05
  sigma_thr: 0.05
  cone_deg: 30.0
  max_steps: 500
  r_collision: 0.0
  r_cone: 0.0
  r_jl: 0.0
  w_progress: 1.0
  manip_damping: 0.001
ppo:
  total_timesteps: 160000000
  learning_rate: 0.0006
  n_steps: 4
  anneal_lr: true
  gamma: 0.99
  gae_lambda: 0.95
  n_minibatches: 32
  update_epochs: 8
  norm_adv: true
  clip_coef: 0.2
  clip_vloss: true
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.02
  hidden_dim: 512
  init_log_std: -0.5
  normalize_returns: true
  squashed_entropy: true
agent:
  d_model: 192
  nhead: 4
  n_layers: 3
line_distribution:
  n_pool: 100000
  n_pool_variant: 20000
  n_target_noise_deg: 5.0
  train_seed: 0
  feasibility_filter: true
  feasibility_threshold_m: 0.1
eval:
  n_holdout: 200
  holdout_seed: 42
train:
  eval_every: 20000000
  ckpt_every_n_updates: 10
