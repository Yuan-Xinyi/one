agent:
  kind: gaussian
env:
  a_max: 0.5
  cone_deg: 30.0
  dir_frac_action: true
  dt: 0.05
  lambda_0: 0.05
  manip_damping: 0.001
  max_steps: 500
  n_envs: 128
  observe_curvature: false
  observe_proj_scales: true
  qd_limit:
  - 2.175
  - 2.175
  - 2.175
  - 2.175
  - 2.61
  - 2.61
  - 2.61
  r_collision: 0.0
  r_cone: 0.0
  r_jl: 0.0
  sigma_thr: 0.05
  tcp_offset: 0.2034
  v: 0.2
  w_progress: 1.0
eval:
  holdout_seed: 42
  n_holdout: 8
line_distribution:
  feasibility_filter: true
  feasibility_threshold_m: 0.1
  n_pool: 2000
  n_target_noise_deg: 5.0
  train_seed: 0
ppo:
  anneal_lr: true
  clip_coef: 0.2
  clip_vloss: true
  ent_coef: 0.01
  gae_lambda: 0.95
  gamma: 0.99
  hidden_dim: 512
  init_log_std: -0.5
  learning_rate: 0.0003
  max_grad_norm: 0.5
  n_minibatches: 32
  n_steps: 32
  norm_adv: true
  normalize_returns: true
  squashed_entropy: true
  target_kl: 0.02
  total_timesteps: 8192
  update_epochs: 10
  vf_coef: 0.5
train:
  ckpt_every_n_updates: 10
  eval_every: 250000
