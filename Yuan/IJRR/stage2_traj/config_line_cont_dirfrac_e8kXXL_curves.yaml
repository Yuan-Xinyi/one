# Flagship recipe (config_line_cont_dirfrac_e8kXXL_rm.yaml) trained on the
# generic-curve distribution of env/path_table.py instead of straight rays
# only: every task is a random piecewise-constant (geodesic curvature,
# normal curvature, twist) process with corners, starting at the task's
# own tip with its tangent and normal; 30% of the tasks are pure straight
# rays, so the straight family stays in distribution. The policy and the
# critic observe the path ahead (observe_preview: 6 channels per look-ahead
# offset, 60 in total) in the path frame at the current arc, which is what
# a start-selection critic needs to see a bend before it happens. Table
# paths need the lateral feedback term (k_lateral) like every curved path.
env:
  dir_frac_action: 2
  a_prev_executed: true
  observe_margins: true
  true_reset_obs: true
  rho_from_norm: true
  observe_proj_scales: true
  table_paths: true
  observe_preview: true
  k_lateral: 5.0
  qd_limit:
  - 2.175
  - 2.175
  - 2.175
  - 2.175
  - 2.61
  - 2.61
  - 2.61
  n_envs: 8192
  dt: 0.05
  v: 0.2
  a_max: 0.5
  lambda_0: 0.05
  sigma_thr: 0.05
  cone_deg: 30.0
  max_steps: 500
  tcp_offset: 0.2034
  r_collision: 0.0
  r_cone: 0.0
  r_jl: 0.0
  w_progress: 1.0
  manip_damping: 0.001
  observe_curvature: false
ppo:
  total_timesteps: 240000000
  learning_rate: 0.0006
  n_steps: 4
  anneal_lr: true
  gamma: 0.99
  gae_lambda: 0.95
  n_minibatches: 32
  update_epochs: 15
  norm_adv: true
  clip_coef: 0.2
  clip_vloss: true
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.02
  hidden_dim: 2048
  init_log_std: -0.5
  normalize_returns: true
  squashed_entropy: true
agent:
  kind: gaussian
line_distribution:
  n_pool: 100000
  n_target_noise_deg: 5.0
  train_seed: 0
  feasibility_filter: true
  feasibility_threshold_m: 0.1
  curves:
    p_straight: 0.3
    seg_len: [0.15, 0.8]
    p_kg: 0.6
    kg_max: 6.0
    p_kn: 0.2
    kn_max: 2.0
    p_tau: 0.2
    tau_max: 1.5
    p_corner: 0.3
    corner_deg: [30.0, 150.0]
    n_seg_max: 6
eval:
  n_holdout: 200
  holdout_seed: 42
train:
  eval_every: 250000
  ckpt_every_n_updates: 10
