env:
  n_envs: 128
  dt: 0.05           # 20 Hz control (was 100 Hz @ dt=0.01)
  v: 0.2             # m/s linear EE speed along u_hat (was 0.05; 4× faster)
  a_max: 0.5         # rad/s nullspace action scale; ||q_dot_null||_2 ≤ 1 rad/s, inside FR3 limits
  lambda_0: 0.05     # DLS damping baseline
  sigma_thr: 0.05    # adaptive damping threshold
  cone_deg: 30.0     # rotation cone half-angle (hard terminate)
  max_steps: 500     # 25 s physical time at dt=0.05 (geometric max ≈ 100 steps)
  tcp_offset: 0.2034 # pen tip = HAND_TCP_OFFSET (0.1034) + PEN_LENGTH (0.10); EE = pen tip
  # Terminal penalties unified to 0; lifetime alone is the performance signal
  r_collision: 0.0
  r_cone: 0.0
  r_jl: 0.0
  # Length-based shaping reward. Weights normalized to sum=1 at runtime.
  # w_progress dominates: in runs21 dm dominated PG (5x prog per step) and
  # the policy chased manipulability without moving the EE. Now progress is
  # the primary signal; jl/dm/cone are minor shaping terms.
  w_progress: 0.6
  w_jl: 0.2
  w_cone: 0.1
  w_dm: 0.1
  delta_scale: 100.0
  w_terminal: 0.0    # signed per-step delta now telescopes; terminal bonus disabled to avoid double-count
  manip_damping: 1.0e-3

ppo:
  total_timesteps: 30000000  # 30M env steps (~70 min wall-clock at 7K steps/s); ~10M episodes
  learning_rate: 3.0e-4
  n_steps: 32
  anneal_lr: true
  gamma: 0.99             # horizon 1/(1-γ)=100 steps = 5s = 1m EE travel; A2 reward normalization handles variance
  gae_lambda: 0.95
  n_minibatches: 32
  update_epochs: 10
  norm_adv: true
  clip_coef: 0.2
  clip_vloss: true
  ent_coef: 0.01                 # v4: initial entropy bonus
  ent_coef_floor: 0.01           # v4: hold floor at 1% (was 0.0)
  ent_coef_anneal_frac: 0.7      # v4: anneal over first 70% of training (was 1.0)
  anneal_ent_coef: true          # linearly decay ent_coef → floor over anneal_frac of training
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.02
  hidden_dim: 512         # widened (256→512) to give actor more capacity for state-dependent μ(s)
  init_log_std: -1.0             # v4: was -0.5
  normalize_returns: true # A2: reward scaling by running std of discounted return; V learns z-score targets

line_distribution:
  n_pool: 100000
  n_target_noise_deg: 5.0
  train_seed: 0
  # Pre-filter pool: drop lines where classical_nullspace controller can't
  # reach `feasibility_threshold_m` of EE travel before terminating. Avoids
  # training the agent on intrinsically infeasible lines (those add noise to
  # the policy gradient without offering anything to learn).
  feasibility_filter: true
  feasibility_threshold_m: 0.1   # 10 cm; at v=0.2 dt=0.05 → 10 steps

baseline:
  k_jl: 1.0
  k_dm: 0.0      # directional manipulability gradient ascent gain; 0 = "weak" GPM-JL only,
                 # >0 = "strong" baseline that uses the same w_u signal as the RL reward
  manip_damping: 1.0e-3

eval:
  n_holdout: 200
  holdout_seed: 42

train:
  eval_every: 10000
  ckpt_every_n_updates: 10
