env:
  n_envs: 128
  dt: 0.05
  v: 0.2
  a_max: 0.5
  lambda_0: 0.05
  sigma_thr: 0.05
  cone_deg: 30.0
  max_steps: 500
  tcp_offset: 0.2034
  r_collision: 0.0
  r_cone: 0.0
  r_jl: 0.0
  w_progress: 1.0
  w_jl: 0.0
  w_cone: 0.0
  w_dm: 0.0
  delta_scale: 100.0
  w_terminal: 0.0
  manip_damping: 0.001
ppo:
  total_timesteps: 1000000
  learning_rate: 0.0003
  n_steps: 32
  anneal_lr: true
  gamma: 0.99
  gae_lambda: 0.95
  n_minibatches: 32
  update_epochs: 10
  norm_adv: true
  clip_coef: 0.2
  clip_vloss: true
  ent_coef: 0.01
  ent_coef_floor: 0.01
  ent_coef_anneal_frac: 0.7
  anneal_ent_coef: true
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.02
  hidden_dim: 512
  init_log_std: -1.0
  normalize_returns: true
line_distribution:
  n_pool: 100000
  n_target_noise_deg: 5.0
  train_seed: 0
  feasibility_filter: true
  feasibility_threshold_m: 0.1
baseline:
  k_jl: 1.0
  k_dm: 0.0
  manip_damping: 0.001
eval:
  n_holdout: 200
  holdout_seed: 42
train:
  eval_every: 50000
  ckpt_every_n_updates: 10
